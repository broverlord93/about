[project]
name = "about"
version = "0.1.0"
description = "Mixed-language monorepo workspace root."
requires-python = ">=3.12"
dependencies = [
    "pandas-stubs~=3.0.5",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["nfl_analyzer"]

[dependency-groups]
dev = [
    "ipykernel",
    "jupyter",
    "ruff",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
